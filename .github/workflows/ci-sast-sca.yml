name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest -v

  security-scan:
    name: SAST & SCA Scan
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit
          pip install pip-audit

      - name: Create Report Directories
        run: |
          mkdir -p reports/sast
          mkdir -p reports/sca

      ###################################################
      # SAST - Bandit
      ###################################################

      - name: Run Bandit (SAST)
        continue-on-error: true
        run: |
          bandit -r . \
            -f json \
            -o reports/sast/bandit-report.json

      ###################################################
      # SCA - pip-audit
      ###################################################

      - name: Run pip-audit (SCA)
        continue-on-error: true
        run: |
          pip-audit \
            --format=json \
            --output reports/sca/pip-audit-report.json

      ###################################################
      # Upload Reports
      ###################################################

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: reports/sast/

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: reports/sca/

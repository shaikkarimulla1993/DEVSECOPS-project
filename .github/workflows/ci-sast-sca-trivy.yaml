name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  IMAGE_NAME: asa-assignment

jobs:
  build-test-security:

    runs-on: ubuntu-latest

    steps:

    #########################################################
    # Checkout
    #########################################################

    - name: Checkout Source
      uses: actions/checkout@v4

    #########################################################
    # Setup Python
    #########################################################

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    #########################################################
    # Install Dependencies
    #########################################################

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest bandit pip-audit

    #########################################################
    # Unit Tests
    #########################################################

    - name: Run Unit Tests
      run: |
        pytest -v

    #########################################################
    # Create Reports Directory
    #########################################################

    - name: Create Reports Directory
      run: |
        mkdir -p reports/sast
        mkdir -p reports/sca
        mkdir -p reports/container

    #########################################################
    # SAST - Bandit
    #########################################################

    - name: Run Bandit
      continue-on-error: true
      run: |
        bandit -r . \
          -f json \
          -o reports/sast/bandit-report.json

    #########################################################
    # SCA - pip-audit
    #########################################################

    - name: Run pip-audit
      continue-on-error: true
      run: |
        pip-audit \
          --format=json \
          --output reports/sca/pip-audit-report.json

    #########################################################
    # Docker Login
    #########################################################

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    #########################################################
    # Build Docker Image
    #########################################################

    - name: Build Docker Image
      run: |
        docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
          .

    #########################################################
    # Install Trivy
    #########################################################

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https gnupg lsb-release

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install -y trivy

    #########################################################
    # Verify Trivy
    #########################################################

    - name: Verify Trivy Installation
      run: |
        trivy --version

    #########################################################
    # Trivy Container Scan
    #########################################################

    - name: Run Trivy Scan
      run: |
        trivy image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --format json \
          --output reports/container/trivy-report.json \
          --exit-code 0 \
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    #########################################################
    # Push Docker Images
    #########################################################

    - name: Push Docker Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

    #########################################################
    # Upload Reports
    #########################################################

    - name: Upload Security Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: reports/

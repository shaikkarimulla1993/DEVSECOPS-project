apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulntracker-api
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vulntracker-api
  template:
    metadata:
      labels:
        {{- include "vulntracker.api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "vulntracker.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}@{{ .Values.api.image.digest }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.api.config.databaseUrl | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.api.config.accessTokenExpireMinutes | quote }}
            - name: NOTIFY_SERVICE_URL
              value: {{ .Values.api.config.notifyServiceUrl | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vulntracker-api-secrets
                  key: SECRET_KEY
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vulntracker-api-secrets
                  key: ADMIN_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulntracker-default-deny
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vulntracker-api-ingress
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vulntracker-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- range $k, $v := .Values.networkPolicy.allowedIngressPodLabels }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    # notify/ runs outside this chart (separate service, not deployed here)
    - to: []
      ports:
        - protocol: TCP
          port: 443
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
